[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcdiag"
version = "0.1.0"
description = "Explain what slows a PC down, spot likely faults, and recommend upgrades that actually help."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pcdiag = "pcdiag.__main__:main"

[tool.setuptools.packages.find]
include = ["pcdiag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
