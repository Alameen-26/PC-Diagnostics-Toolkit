# Runs the pytest suite on Windows and Linux.
#
# Why both OSes: the toolkit targets Windows first, but every Windows-only
# code path must degrade gracefully elsewhere. On windows-latest the live
# smoke tests (e.g. `python -m pcdiag scan --json`) exercise the real
# PowerShell, CIM, registry and powercfg collectors; on ubuntu-latest they
# exercise the psutil/sysfs fallbacks.
#
# Why 3.10 and 3.13: the oldest supported Python (pyproject requires >=3.10)
# and the newest one we develop on.
#
# Added in v0.1.0
name: tests

on:
  push:
  pull_request:
  # Monthly run (09:00 UTC on the 1st) catches breakage from new psutil,
  # Python or runner-image releases even when nobody has pushed code.
  schedule:
    - cron: "0 9 1 * *"
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read  # the tests only need to read the code

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # a full run takes seconds; this guards against a hung PowerShell call
    strategy:
      fail-fast: false  # keep the other OS/Python results even if one combination fails
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Editable install with the dev extra (pytest), same as the README.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      # Show what a real scan sees on this runner (handy when a Windows
      # collector behaves differently on CI than on a laptop).
      - name: Smoke scan
        run: python -m pcdiag scan --quick --no-save
