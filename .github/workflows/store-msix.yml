# Builds an unsigned MSIX package for the Microsoft Store.
#
# Run it from the Actions tab ("Run workflow"). Copy identity_name, publisher
# and publisher_display_name from Partner Center > your app > Product
# management > Product identity. The Store signs the package when it is
# published, so no certificate is needed. Download the .msix from the run's
# artifacts and upload it in Partner Center.
#
# The run also installs a test-signed copy on the build machine and runs it,
# to prove the package works. That copy is thrown away.
#
# Copyright (c) NiyiSoft. All rights reserved.
name: store-msix

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Package/Identity/Name from Partner Center"
        required: true
        default: "NiyiSoft.PCDiagnosticsToolkit"
      publisher:
        description: "Package/Identity/Publisher from Partner Center (CN=...)"
        required: true
        default: "CN=00000000-0000-0000-0000-000000000000"
      publisher_display_name:
        description: "Package/Properties/PublisherDisplayName from Partner Center"
        required: true
        default: "NiyiSoft"
      version:
        description: "Package version, four numbers, last one 0 (e.g. 0.3.0.0)"
        required: true
        default: "0.3.0.0"

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    env:
      ID_NAME: ${{ github.event.inputs.identity_name }}
      PUBLISHER: ${{ github.event.inputs.publisher }}
      PUB_DISPLAY: ${{ github.event.inputs.publisher_display_name }}
      PKG_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install . pyinstaller

      - name: Build the exe
        shell: pwsh
        run: |
          pyinstaller --onefile --console --clean --name pcdiag `
            --paths packaging --hidden-import exe_launcher `
            --collect-submodules pcdiag packaging/store_launcher.py
          & dist\pcdiag.exe --version; if ($LASTEXITCODE) { exit 1 }

      - name: Lay out the package
        shell: pwsh
        run: |
          if ($env:PKG_VERSION -notmatch '^\d+\.\d+\.\d+\.0$') { throw "version must look like 0.3.0.0" }
          $root = "msix\layout"
          New-Item -ItemType Directory -Force "$root\Assets" | Out-Null
          Copy-Item dist\pcdiag.exe $root\

          # Logos: the NiyiSoft mark from docs/brand, centred on a transparent canvas.
          Add-Type -AssemblyName System.Drawing
          $svg = Get-Content docs\brand\niyisoft-badge.svg -Raw
          $b64 = [regex]::Match($svg, 'base64,([A-Za-z0-9+/=]+)').Groups[1].Value
          $ms = New-Object IO.MemoryStream(,[Convert]::FromBase64String($b64))
          $src = [Drawing.Image]::FromStream($ms)
          $sizes = @{
            "Square44x44Logo.png" = @(44,44);  "Square44x44Logo.targetsize-44_altform-unplated.png" = @(44,44)
            "Square150x150Logo.png" = @(150,150); "StoreLogo.png" = @(50,50)
            "Wide310x150Logo.png" = @(310,150); "SplashScreen.png" = @(620,300)
          }
          foreach ($name in $sizes.Keys) {
            $w, $h = $sizes[$name]
            $bmp = New-Object Drawing.Bitmap($w, $h)
            $g = [Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = 'HighQualityBicubic'
            $g.Clear([Drawing.Color]::Transparent)
            $scale = [math]::Min(($w * 0.92) / $src.Width, ($h * 0.92) / $src.Height)
            $dw = [int]($src.Width * $scale); $dh = [int]($src.Height * $scale)
            $g.DrawImage($src, [int](($w - $dw) / 2), [int](($h - $dh) / 2), $dw, $dh)
            $bmp.Save("$root\Assets\$name", [Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

          $esc = { param($s) [Security.SecurityElement]::Escape($s) }
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package
            xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
            xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
            xmlns:uap5="http://schemas.microsoft.com/appx/manifest/uap/windows10/5"
            xmlns:desktop4="http://schemas.microsoft.com/appx/manifest/desktop/windows10/4"
            xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
            IgnorableNamespaces="uap uap5 desktop4 rescap">
            <Identity Name="$(& $esc $env:ID_NAME)" Publisher="$(& $esc $env:PUBLISHER)" Version="$env:PKG_VERSION" ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>PC Diagnostics Toolkit</DisplayName>
              <PublisherDisplayName>$(& $esc $env:PUB_DISPLAY)</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
              <Description>Find out what slows your PC down, with a plain-English plan to fix it.</Description>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />
            </Dependencies>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Applications>
              <Application Id="PCDiagnosticsToolkit" Executable="pcdiag.exe" EntryPoint="Windows.FullTrustApplication" desktop4:Subsystem="console">
                <uap:VisualElements DisplayName="PC Diagnostics Toolkit" Description="Find out what slows your PC down."
                  BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:DefaultTile Wide310x150Logo="Assets\Wide310x150Logo.png" />
                  <uap:SplashScreen Image="Assets\SplashScreen.png" />
                </uap:VisualElements>
                <Extensions>
                  <uap5:Extension Category="windows.appExecutionAlias" Executable="pcdiag.exe" EntryPoint="Windows.FullTrustApplication">
                    <uap5:AppExecutionAlias desktop4:Subsystem="console">
                      <uap5:ExecutionAlias Alias="pcdiag.exe" />
                    </uap5:AppExecutionAlias>
                  </uap5:Extension>
                </Extensions>
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
          </Package>
          "@
          ($manifest -replace '(?m)^          ', '').Trim() | Out-File -Encoding utf8 "$root\AppxManifest.xml"
          Get-Content "$root\AppxManifest.xml"

      - name: Pack with makeappx
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "makeappx.exe not found" }
          "SDK_BIN=$($sdk.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $out = "msix\PCDiagnosticsToolkit-$env:PKG_VERSION-x64.msix"
          & $sdk.FullName pack /d msix\layout /p $out /o; if ($LASTEXITCODE) { exit 1 }
          "MSIX=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test install (test-signed copy, thrown away)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER -KeyUsage DigitalSignature `
            -FriendlyName "MSIX test" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = "msix\test.pfx"; $pw = ConvertTo-SecureString -String "test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          Copy-Item $env:MSIX msix\test.msix
          & "$env:SDK_BIN\signtool.exe" sign /fd SHA256 /f $pfx /p test msix\test.msix; if ($LASTEXITCODE) { exit 1 }
          Add-AppxPackage msix\test.msix
          Get-AppxPackage -Name $env:ID_NAME | Format-List Name, Version, InstallLocation
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\pcdiag.exe"
          if (-not (Test-Path $alias)) { throw "pcdiag alias not created" }
          & $alias --version; if ($LASTEXITCODE) { exit 1 }
          & $alias demo slow_old_laptop --no-save; if ($LASTEXITCODE) { exit 1 }
          Get-AppxPackage -Name $env:ID_NAME | Remove-AppxPackage

      - uses: actions/upload-artifact@v4
        with:
          name: store-msix-${{ github.event.inputs.version }}
          path: ${{ env.MSIX }}
          if-no-files-found: error
